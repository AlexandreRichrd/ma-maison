name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Regenerates route types — see this repo's CLAUDE.md Commands section.
      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      # test:e2e (Playwright) is intentionally not run here: it needs a live
      # my-home-backend instance plus Postgres, which means checking out a
      # second private repo and standing up both services in CI. Left as a
      # local/manual pre-push check for now — see this repo's CLAUDE.md
      # Testing section.
