services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: home_manager
      POSTGRES_PASSWORD: home_manager
      POSTGRES_DB: home_manager
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Loopback-only: reachable from the host (for local `npm run dev` /
    # `npm run db:migrate`) but never bound to 0.0.0.0. The app container
    # below reaches it over the internal compose network instead.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://home_manager:home_manager@postgres:5432/home_manager
      SESSION_SECRET: ${SESSION_SECRET}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
    # Bind to loopback (or your Tailscale/WireGuard interface address) —
    # never 0.0.0.0. This app is never exposed to the public internet.
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
