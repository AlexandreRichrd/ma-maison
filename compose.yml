services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: home_manager
      POSTGRES_PASSWORD: home_manager
      POSTGRES_DB: home_manager
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No ports here on purpose — never bound to 0.0.0.0, and not even to
    # 127.0.0.1 by default now that this ships to a public-internet VPS.
    # Local dev adds a loopback mapping back via compose.override.yml
    # (auto-loaded by plain `docker compose` commands, no flags needed).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://home_manager:home_manager@postgres:5432/home_manager
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
    # No ports here either — compose.prod.yml adds the loopback-only
    # 127.0.0.1:3000 mapping Caddy proxies to. Local dev normally runs
    # the app on the host via `npm run dev`, not this container.

volumes:
  postgres-data:
