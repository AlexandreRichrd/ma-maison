# VPS deployment only. Run explicitly alongside the base file — this is
# NOT auto-loaded like compose.override.yml is:
#
#   docker compose -f compose.yml -f compose.prod.yml up -d
#
# Adds Caddy (automatic HTTPS, HSTS) and the app's loopback-only port so
# Caddy has something to proxy to. Postgres stays off the host entirely —
# no port mapping is added here, unlike compose.override.yml's local-dev one.
services:
  app:
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
